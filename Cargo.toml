[workspace]
resolver = "3"
members = ["./crates/*"]

[workspace.package]
version = "0.0.17"
edition = "2024"

[workspace.dependencies]
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.9.10" }
envoy = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.9.10" }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.9.10" }

bindgen = "0.72.1"
bytemuck = "1.25.2"
criterion = { package = "codspeed-criterion-compat", version = "5.0.1" }
dnc = { path = "./crates/dnc" }
dunce = "1.0.5"
float-cmp = "0.10.0"
fornax = { path = "./crates/fornax" }
fornax-core = { path = "./crates/fornax-core" }
fornax-dalim = { path = "./crates/fornax-dalim" }
fornax-devtool = { path = "./crates/fornax-devtool" }
image = { git = "https://github.com/Glatzel/image-rs" }
jiff = "0.2.35"
libc = "0.2.189"
libraw = { path = "./crates/libraw" }
libraw-sys = { path = "./crates/libraw-sys" }
num_enum = "0.7.6"
numpy = "0.29.0"
path-slash = "0.2.1"
pyo3 = { version = "0.29.2", features = ["abi3-py313", "extension-module"] }
rand = "0.10.2"
rayon = "1.12.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
